---
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: jenkins-q
  name: jenkins-config
data:
  apply_config.sh: |-
    echo "--- Init Container ---"
    cp /var/jenkins_config/plugins.txt /var/jenkins_home;
    cp /var/jenkins_config/init-config.groovy /usr/share/jenkins/ref/init.groovy.d;

    # Install missing plugins
    echo "--- Install missing plugins ---"
    rm -rf /usr/share/jenkins/ref/plugins/*.lock
    /usr/local/bin/install-plugins.sh `echo $(cat /var/jenkins_home/plugins.txt)`;
    # Copy plugins to shared volume
    echo "--- Copy plugins to shared volume ---"
    yes n | cp -i /usr/share/jenkins/ref/plugins/* /var/jenkins_plugins/;

  init-config.groovy: |
    /*
    * Create an admin user.
    */
    import jenkins.model.*
    import hudson.model.*;
    import hudson.security.*
    import hudson.security.csrf.DefaultCrumbIssuer
    import jenkins.security.s2m.AdminWhitelistRule
    import org.kohsuke.stapler.StaplerProxy

    println "--> creating admin user"

    def jenkins = Jenkins.getInstance()

    def adminUsername = "${username}" // ใส่ username ของ Jenkins Admin
    def adminPassword = "${password}" // ใส่ password ของ Jenkins Admin

    def hudsonRealm = new HudsonPrivateSecurityRealm(false)
    hudsonRealm.createAccount(adminUsername, adminPassword)
    jenkins.setSecurityRealm(hudsonRealm)
    def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
    strategy.setAllowAnonymousRead(false)
    jenkins.setAuthorizationStrategy(strategy)

    println "--> Set master executer to 1"
    jenkins.setNumExecutors(1)

    println("--> Enable Slave -> Master Access Control")
    jenkins.getExtensionList(StaplerProxy.class)
        .get(AdminWhitelistRule.class)
        .masterKillSwitch = false

    println("--> Checking the CSRF protection")
    if (jenkins.crumbIssuer == null) {
        println "CSRF protection is disabled, Enabling the default Crumb Issuer"
        jenkins.crumbIssuer = new DefaultCrumbIssuer(true)
    }

    println("--> Setup TCP port for JNLP agents")
    jenkins.setSlaveAgentPort(50000)

    jenkins.save()
  
