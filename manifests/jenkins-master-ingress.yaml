---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-master
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  namespace: jenkins-q
spec:
  rules:
  - http:
      paths:
      - path: /chakorn/jenkins
        pathType: Prefix
        backend:
          service:
            name: jenkins-web
            port:
              number: 80
          