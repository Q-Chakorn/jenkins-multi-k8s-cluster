apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jenkins-master-ingress
  namespace: jenkins-q
spec:
  podSelector:
    matchLabels:
      app: jenkins
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - namespaceSelector:
        matchLabels:
          jenkins-agent-access: "true"
    ports:
    - protocol: TCP
      port: 50000